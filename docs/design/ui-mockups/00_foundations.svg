<tspan x="744" dy="0">Property manager / analyst</tspan>
</text>
<text x="744" y="278.6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#283229">
<tspan x="744" dy="0">Browse guests and bookings. Inspect audit history, revenue,</tspan>
<tspan x="744" dy="22.4">search hotspots, reviews and accessibility.</tspan>
</text>
<text x="744" y="341.05" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#7b8176">
<tspan x="744" dy="0">These are usage personas, not separate authenticated roles.</tspan>
</text>
