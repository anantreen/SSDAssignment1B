<tspan x="72" dy="0">Guest · demo actor</tspan>
</text>
<text x="72" y="278.6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#283229">
<tspan x="72" dy="0">Browse → inspect a property → book → check in → complete.</tspan>
</text>
<text x="72" y="326.05" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#7b8176">
<tspan x="72" dy="0">Switch Ananya Rao in the header. Wallet example: ₹50,000.00.</tspan>
<tspan x="72" dy="18.2">The current app uses a demo actor picker; it has no login page.</tspan>
</text>
</g>
<g data-section="manager-role">
