<tspan x="48" dy="0">00 / FOUNDATIONS &amp; USERS · MEMBER 1</tspan>
</text>
<text x="48" y="113.4" font-family="Georgia, Times New Roman, serif" font-size="44" font-weight="400" fill="#283229">
<tspan x="48" dy="0">StaySpot. Thoughtful stays.</tspan>
</text>
<text x="48" y="158.6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#7b8176">
<tspan x="48" dy="0">Existing UI system, demo users and shared component reference.</tspan>
</text>
</g>
<g data-section="guest-role">
<rect x="48" y="206" width="648" height="195" rx="9" fill="#fdfdfb" stroke="#e6e8e0" opacity="1.0"/>
